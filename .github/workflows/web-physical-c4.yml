name: web-physical-c4

on:
  pull_request:
    paths:
      - "crates/moonlight-wasm/**"
      - "crates/moonlight-dsp/**"
      - "lib/audio/**"
      - "public/audio/**"
      - "app/lab/engine/**"
      - "app/globals.css"
      - "tests/unit/**"
      - "tests/build/**"
      - "tests/browser/bicycle-score-audio.test.mjs"
      - "tests/browser/*hammer*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - "build/**"
      - "scripts/build-web-audio-wasm.mjs"
      - "scripts/build-browser-sound-engine.mjs"
      - "scripts/generate-bicycle-grand-staff.py"
      - "docs/practiced-songs/bicycle-built-for-two-grand-staff.html"
      - "scripts/run-vinext.mjs"
      - ".github/workflows/web-physical-c4.yml"
  push:
    branches:
      - feat/web-physical-c4-audioworklet
    paths:
      - "crates/moonlight-wasm/**"
      - "crates/moonlight-dsp/**"
      - "lib/audio/**"
      - "public/audio/**"
      - "app/lab/engine/**"
      - "app/globals.css"
      - "tests/unit/**"
      - "tests/build/**"
      - "tests/browser/*hammer*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - "build/**"
      - "scripts/build-web-audio-wasm.mjs"
      - "scripts/run-vinext.mjs"
      - ".github/workflows/web-physical-c4.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo test -p moonlight-wasm
      - name: Clean production build includes browser audio assets
        run: npm run test:build
      - run: node --test tests/unit/production-build.test.mjs
      - run: node --experimental-strip-types --test tests/unit/sound-engine.test.mjs tests/unit/physical-c4-worklet.test.mjs tests/unit/basic-piano-worklet.test.mjs tests/unit/basic-piano-source-ownership.test.mjs tests/unit/score-piano-controller.test.mjs tests/unit/c4-velocity-sweep.test.mjs
      - run: npx tsc -p tsconfig.audio-worklet.json --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Standalone grand staff browser audio acceptance
        run: npm run test:score-audio
      - name: C4 hammer native-WASM parity and real AudioWorklet acceptance
        run: npm run test:hammer
