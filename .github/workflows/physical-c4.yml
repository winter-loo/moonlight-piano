name: physical-c4

on:
  push:
    branches:
      - feat/physical-c4-offline
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "fixtures/physical-c4/**"
      - "scripts/render-physical-c4.sh"
      - "docs/audio/physical-c4-tracer.md"
      - ".github/workflows/physical-c4.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "fixtures/physical-c4/**"
      - "scripts/render-physical-c4.sh"
      - "docs/audio/physical-c4-tracer.md"
      - ".github/workflows/physical-c4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Apply pinned formatter and first Clippy correction
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/moonlight-model/src/lib.rs")
          source = path.read_text()
          old = "if !self.output_gain.is_finite() || !(0.0 < self.output_gain && self.output_gain <= 1.0) {"
          new = "if !(self.output_gain.is_finite() && 0.0 < self.output_gain && self.output_gain <= 1.0) {"
          if old not in source:
              raise SystemExit("expected Clippy target expression was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml crates
            git commit -m "fix(rust): satisfy strict Clippy validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Build WebAssembly boundary
        run: cargo build -p moonlight-wasm --target wasm32-unknown-unknown
      - name: Render twice and prove deterministic artifacts
        run: |
          scripts/render-physical-c4.sh work/c4-a
          scripts/render-physical-c4.sh work/c4-b
          cmp work/c4-a/c4-reference.wav work/c4-b/c4-reference.wav
          cmp work/c4-a/c4-report.json work/c4-b/c4-report.json
          cmp work/c4-a/c4-energy.csv work/c4-b/c4-energy.csv
      - name: Benchmark smoke test
        run: cargo run --quiet --release -p moonlight-bench
      - name: Upload audible tracer and reports
        uses: actions/upload-artifact@v4
        with:
          name: physical-c4-${{ github.sha }}
          path: |
            work/c4-a/c4-reference.wav
            work/c4-a/c4-report.json
            work/c4-a/c4-energy.csv
            work/c4-a/c4-timing.json
          if-no-files-found: error
